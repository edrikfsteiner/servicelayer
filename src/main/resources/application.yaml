spring:
  mongodb:
    uri: ${MONGODB_URI}

  threads:
    virtual:
      enabled: true

  devtools:
    virtual:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-time: 3600
  messaging:
    exchange: ingestion.exchange
    queue-main: lakehouse.bronze.queue
    queue-dlq: lakehouse.bronze.dlq
    routing-key-main: ingestion.routing.key
    routing-key-dlq: ingestion.dlq.routing.key