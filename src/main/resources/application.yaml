spring:
  mongodb:
    uri: mongodb://root:root@localhost:27017/lakehouse_db?authSource=admin

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        concurrency: 2
        max-concurrency: 2
        prefetch: 1

app:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
      expiration-time: 3600
      issuer: lakehouse-api

  messaging:
    exchange: ingestion.exchange
    queue-main: lakehouse.bronze.queue
    queue-dlq: lakehouse.bronze.dlq
    queue-transformation: lakehouse.silver.queue
    routing-key-main: ingestion.routing.key
    routing-key-dlq: ingestion.dlq.routing.key
    routing-key-transformation: transformation.routing.key

  rate-limit:
    capacity: 10000
    minutes: 1

  transformation:
    scheduler:
      cron: "0 0 0 * 12 *"
