spring:
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/lakehouse_db?authSource=admin

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://models.inference.ai.azure.com
      chat:
        completions-path: /chat/completions
        options:
          model: gpt-4o-mini
          temperature: 0.0

app:
  messaging:
    exchange: ingestion.exchange
    queue-main: lakehouse.bronze.queue
    queue-dlq: lakehouse.bronze.dlq
    routing-key-main: ingestion.routing.key
    routing-key-dlq: ingestion.dlq.routing.key