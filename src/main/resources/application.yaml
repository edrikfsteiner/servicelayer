spring:
  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://models.inference.ai.azure.com
      chat:
        completions-path: /chat/completions
        options:
          model: gpt-4o-mini
          temperature: 0.0

app:
  datasource:
    lakehouse:
      jdbc-url: jdbc:postgresql://localhost:5432/lakehouse_db
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver
  messaging:
    exchange: ingestion.exchange
    queue-main: lakehouse.bronze.queue
    queue-dlq: lakehouse.bronze.dlq
    routing-key-main: ingestion.routing.key
    routing-key-dlq: ingestion.dlq.routing.key

  jpa:
    hibernate:
      ddl-auto: none
      show-sql: false