spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-time: 3600
  messaging:
    exchange: ingestion.exchange
    queue-main: lakehouse.bronze.queue
    queue-dlq: lakehouse.bronze.dlq
    routing-key-main: ingestion.routing.key
    routing-key-dlq: ingestion.dlq.routing.key

rate-limit:
  capacity: 1000   # max requests per window per tenant
  minutes: 1       # sliding window size in minutes

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini  # cost-effective model; override with gpt-4o for higher accuracy

silver:
  scheduler:
    fixed-delay-ms: 300000  # 5 minutes between scheduler runs