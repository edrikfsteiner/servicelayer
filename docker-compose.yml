services:
  origin:
    image: mysql:8.0
    container_name: origin-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: origin_db
    ports:
      - "3306:3306"
    volumes:
      - origin_data:/var/lib/origin
    restart: unless-stopped

  target:
    image: postgres:16-alpine
    container_name: target-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: target_db
    ports:
      - "5432:5432"
    volumes:
      - target_data:/var/lib/target/data
    restart: unless-stopped

  rabbitmq-broker:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    restart: unless-stopped

volumes:
  origin_data:
  target_data: